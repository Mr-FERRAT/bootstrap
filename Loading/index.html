<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
    <link rel="stylesheet" href="stype.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <!--les spinner-->
    <div class="container">
        <h1>Les spinners</h1>
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="row p-5">
            <div class="col-2">
                <div class="spinner-grow text-dark"></div>
            </div>
            <div class="col-2">
                <div class="spinner-grow text-primary"></div>
            </div>
            <div class="col-2">
                <div class="spinner-grow text-warning"></div>
            </div>
            <div class="col-2">
                <div class="spinner-grow text-danger"></div>
            </div>
            <div class="col-2">
                <div class="spinner-grow text-success"></div>
            </div>
        </div>

        <button class="btn btn-dark">
            <span class="spinner-border spinner-border-sm"></span>
            Loading...
        </button>

        <!--Progress-->

        <div class="container m-5 shadow p-3">
            <h1>Progress</h1>
            <div class="progress bg-secondary">
                <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="66" style="width: 66%;">66%</div>
            </div>
        </div>
        
    </div>

    <!--Les placeholders-->
    <div class="card bg-danger placeholder-wave col-6 offset-3 border-0 shadow">

        <div class="ratio ratio-16x9">
            <div class="placeholder"></div>
        </div>
        
        <p class="placeholder-glow px-4">
            <span class="col-6 placeholder offset-3"></span>
            <span class="col-12 placeholder"></span>
            <span class="col-12 placeholder"></span>
            <span class="col-12 placeholder"></span>
        </p>
        <button class="btn btn-primary placeholder disabled mx-5 mb-2"></button>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
